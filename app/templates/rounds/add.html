{% extends "base.html" %}
{% block title %}Add Round — PlacementLog{% endblock %}
{% block content %}
<h1>Add Round</h1>
<p class="page-subtitle">for {{ application.company.name }}</p>

<form action="{{ url_for('rounds.add_round', application_id=application.id) }}" method="POST">
    <label>Round Type</label>
    <select name="round_type" required>
        <option value="OA">OA</option>
        <option value="TR1">TR1</option>
        <option value="TR2">TR2</option>
        <option value="TR3">TR3</option>
        <option value="HR">HR</option>
    </select>

    <label>Round Date</label>
    <input type="date" name="round_date">

    <label>Performance Rating (1–5)</label>
    <input type="number" name="performance_rating" min="1" max="5">

    <label>Topics Asked</label>
    <textarea name="topics_asked" placeholder="e.g. DP, Graphs, OS"></textarea>
    <p class="form-hint">Comma-separated.</p>

    <label>Outcome</label>
    <select name="outcome" required>
        <option value="Pending">Pending</option>
        <option value="Passed">Passed</option>
        <option value="Failed">Failed</option>
    </select>

    <div class="form-actions">
        <button type="submit" class="btn">Add Round</button>
        <a class="btn btn-secondary" href="{{ url_for('applications.application_detail', id=application.id) }}">Cancel</a>
    </div>
</form>
{% endblock %}
